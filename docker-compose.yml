services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: laravel-app
    env_file:
      - .env
    user: "${UID}:${GID}"

    volumes:
      - .:/var/www/html

  nginx:
    image: nginx:latest

    container_name: laravel-nginx

    ports:
      - "8080:80"

    volumes:
        - .:/var/www/html
        - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

  redis:
    image: redis:7-alpine

    container_name: laravel-redis

    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  pgsql-data:
    driver: local
  redis-data:
    driver: local